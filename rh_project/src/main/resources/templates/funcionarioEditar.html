<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar Funcionário</title>
</head>
<body>
<h1>Editar Funcionário</h1>

<div th:if="${erro}" style="color:red;">
    <p th:text="${erro}"></p>
</div>

<form action="/funcionarios/editar" method="post">

    <input type="hidden" name="id" th:value="${funcionario.id}" />

    Nome: 
    <input type="text" name="nome" th:value="${funcionario.nome}" /><br/>

    CPF: 
    <input type="text" name="cpf" th:value="${funcionario.cpf}" /><br/>

    Email: 
    <input type="text" name="email" th:value="${funcionario.email}" /><br/>

    Data Contratação (yyyy-mm-dd): 
    <input type="date" name="dataContratacao" 
           th:value="${funcionario.dataContratacao}" /><br/>

    Salário: 
    <input type="number" step="0.01" name="salario" th:value="${funcionario.salario}" /><br/>

    Departamento:
    <select name="departamento_id">
        <option value="">--</option>
        <option th:each="d : ${departamentos}" 
                th:value="${d.id}" 
                th:text="${d.nome}" 
                th:selected="${funcionario.departamento != null and funcionario.departamento.id == d.id}">
        </option>
    </select><br/>

    Cargo:
    <select name="cargo_id">
        <option value="">--</option>
        <option th:each="c : ${cargos}" 
                th:value="${c.id}" 
                th:text="${c.nome}" 
                th:selected="${funcionario.cargo != null and funcionario.cargo.id == c.id}">
        </option>
    </select><br/>

    Chefe:
    <select name="chefeId">
        <option value="">--</option>
        <option th:each="ch : ${chefes}" 
                th:value="${ch.id}" 
                th:text="${ch.nome}" 
                th:selected="${funcionario.chefe != null and funcionario.chefe.id == ch.id}">
        </option>
    </select><br/>

    <input type="submit" value="Salvar" />
</form>

<a href="/funcionarios/listar">Voltar</a>

</body>
</html>
