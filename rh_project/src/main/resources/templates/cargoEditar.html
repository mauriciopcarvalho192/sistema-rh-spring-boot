<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Editar Cargo</title></head>
<body>
    <h1>Editar Cargo</h1>
    <form action="/cargos/editar" method="post">
        <input type="hidden" name="id" th:value="${cargo.id}" />
        Nome: <input type="text" name="nome" th:value="${cargo.nome}" /><br/>
        Descrição: <input type="text" name="descricao" th:value="${cargo.descricao}" /><br/>
        <input type="submit" value="Salvar" />
    </form>
    <a href="/cargos/listar">Voltar</a>
</body>
</html>
